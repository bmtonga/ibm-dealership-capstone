services:
  - type: web
    name: bmtonga-dealership-web
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && DISABLE_ESLINT_PLUGIN=true npm run build && cd .. && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn djangoproj.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /djangoapp/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bmtonga-dealership-db
          property: connectionString
      - key: BACKEND_URL
        value: https://bmtonga-dealership-api.onrender.com
      - key: SENTIMENT_ANALYZER_URL
        value: https://bmtonga-dealership-sentiment.onrender.com
      - key: ALLOWED_HOSTS
        value: bmtonga-dealership-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://bmtonga-dealership-web.onrender.com

  - type: web
    name: bmtonga-dealership-api
    runtime: node
    plan: free
    rootDir: server/database
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

  - type: web
    name: bmtonga-dealership-sentiment
    runtime: python
    plan: free
    rootDir: server/djangoapp/microservices
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health

databases:
  - name: bmtonga-dealership-db
    plan: free
    databaseName: dealerships
    user: dealership_app
